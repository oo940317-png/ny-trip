 ['flightvegas','JFK → 라스베가스 항공','5/17','5/17','오후 4:30 출발 예정 · 예약 확인'],
 ['canyon','그랜드캐년 투어','5/19','5/19','03:00~21:00 · 픽업 장소 확인'],
 ['vegasflight','5/21 아침 항공편','5/21','5/21','출발 시간·공항 터미널 확인'],
 ['peter','피터루거 스테이크하우스','5/15','5/15','예약 권장'],
 ['buffet','바카날 뷔페','5/20','5/20','선택 식사 · 예약 권장']
];
const PREBOOK_KEY='usa-trip-prebooking-v17';
let prebookState=JSON.parse(localStorage.getItem(PREBOOK_KEY)||'{}');
function savePrebook(){localStorage.setItem(PREBOOK_KEY,JSON.stringify(prebookState))}
function prebookCard([id,name,area,date,note]){
 const v=prebookState[id]||{};
 const status=v.status||'planned';
 return `<div class="prebook-card">
 <div class="prebook-heading"><div><b>${esc(name)}</b><div class="subtle">${esc(area)} · ${esc(date)}</div></div>
 <select class="input prebook-status" data-prebook="${id}" aria-label="${esc(name)} 예약 상태">
 <option value="planned" ${status==='planned'?'selected':''}>구매 예정</option>
 <option value="paid" ${status==='paid'?'selected':''}>구매 완료</option>
 <option value="used" ${status==='used'?'selected':''}>사용 완료</option>
 </select></div>
 <p class="subtle">${esc(note)}</p>
 <div class="prebook-details"><input class="input" data-prebook-number="${id}" placeholder="예약번호 (선택)" value="${esc(v.number||'')}">
 <label class="prebook-upload">📎 바우처/QR/PDF 첨부 <input type="file" multiple accept="image/*,application/pdf" data-prebook-file="${id}"></label></div>
 <div class="prebook-files" id="prebook-files-${id}"></div></div>`;
}
function ticketView(){
 let completed=PREBOOK.filter(([id])=>['paid','used'].includes((prebookState[id]||{}).status)).length;
 return `<section class="card"><div class="eyebrow">BOOK BEFORE YOU GO</div><h2 class="sectiontitle">출국 전 예약 체크리스트</h2>
 <p class="subtle">우리가 정했던 미리 예약·구매할 항목을 다시 넣었어. 예약 상태와 예약번호는 이 기기에 저장돼. 실제 구매 여부는 임의로 표시하지 않았어.</p>
 <div class="prebook-progress"><b>${completed} / ${PREBOOK.length}</b> 예약·구매 완료 또는 사용 완료</div>
 ${PREBOOK.map(prebookCard).join('')}
 <h3 style="margin:30px 0 8px">직접 추가하는 예약</h3>
 <p class="subtle">기존에 등록했던 예약 목록도 그대로 유지돼.</p>
 <form id="ticketForm" class="stack"><input class="input" name="name" placeholder="입장권 / 예약명" required><input class="input" name="date" type="date" required><input class="input" name="details" placeholder="예약처, 예약번호, 메모"><select class="input" name="status"><option value="pending">예약 예정</option><option value="paid">결제 완료</option><option value="reserved">예약 완료 · 미결제</option></select><button class="btn dark">+ 예약 추가</button></form>
 <div id="ticketList">${tickets.length?tickets.map((t,i)=>`<div class="info"><b>${esc(t.name)} · ${esc(t.date)}</b>${esc(t.details)} · ${esc(t.status==='paid'?'결제 완료':t.status==='reserved'?'예약 완료':'예약 예정')} <button class="edit" data-del-ticket="${i}">삭제</button></div>`).join(''):'<div class="empty">직접 추가한 예약이 없습니다.</div>'}</div>
 <div class="notice">첨부 파일은 로그인이나 서버 전송 없이 이 브라우저의 IndexedDB에 저장돼. 브라우저 데이터 삭제·기기 변경 시 없어질 수 있으니 원본도 별도로 보관해 줘.</div>
 </section>`;
}
let vaultDBPromise=null;
function vaultDB(){
 if(!vaultDBPromise)vaultDBPromise=new Promise((resolve,reject)=>{
  const req=indexedDB.open('usa-trip-voucher-v17',1);
  req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('files')){const st=db.createObjectStore('files',{keyPath:'key'});st.createIndex('booking','booking')}};
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
 });
 return vaultDBPromise;
}
async function addVoucher(booking,file){
 const db=await vaultDB();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('files','readwrite');
  tx.objectStore('files').put({key:booking+'-'+Date.now()+'-'+Math.random().toString(36).slice(2),booking,name:file.name,mime:file.type,blob:file});
  tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
 });
}
async function listVouchers(booking){
 const db=await vaultDB();
 return new Promise((resolve,reject)=>{
  const req=db.transaction('files','readonly').objectStore('files').index('booking').getAll(booking);
  req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
 });
}
async function removeVoucher(key){
 const db=await vaultDB();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(key);
  tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
 });
}
async function refreshVoucherFiles(booking){
 const target=document.getElementById('prebook-files-'+booking);if(!target)return;
 try{
 const files=await listVouchers(booking);
 if(!target.isConnected)return;
 target.replaceChildren();
 for(const f of files){
  const row=document.createElement('div');row.className='voucher-row';
  const link=document.createElement('button');link.className='edit';link.textContent='📄 '+f.name;
  link.onclick=()=>{const url=URL.createObjectURL(f.blob);const a=document.createElement('a');a.href=url;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)};
  const del=document.createElement('button');del.className='edit';del.textContent='삭제';del.onclick=async()=>{if(confirm('첨부 파일을 삭제할까요?')){await removeVoucher(f.key);refreshVoucherFiles(booking)}};
  row.append(link,del);target.append(row);
 }
 }catch(e){target.textContent='파일 저장소를 사용할 수 없는 브라우저입니다.'}
}
function wirePrebook(){
 document.querySelectorAll('[data-prebook]').forEach(el=>el.onchange=()=>{(prebookState[el.dataset.prebook]??={}).status=el.value;savePrebook();render()});
 document.querySelectorAll('[data-prebook-number]').forEach(el=>el.onchange=()=>{(prebookState[el.dataset.prebookNumber]??={}).number=el.value;savePrebook()});
 document.querySelectorAll('[data-prebook-file]').forEach(el=>el.onchange=async()=>{
  const booking=el.dataset.prebookFile;
  try{for(const file of el.files)await addVoucher(booking,file);await refreshVoucherFiles(booking);el.value=''}
  catch(e){alert('파일을 저장하지 못했어. 브라우저 저장 공간을 확인해 줘.')}
 });
 PREBOOK.forEach(([id])=>refreshVoucherFiles(id));
}
const origRender=render;render=function(){origRender();if(active==='tickets'){wirePrebook();$('ticketForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);tickets.push(Object.fromEntries(f));localStorage.setItem(TICKET_KEY,JSON.stringify(tickets));render()};document.querySelectorAll('[data-del-ticket]').forEach(b=>b.onclick=()=>{tickets.splice(+b.dataset.delTicket,1);localStorage.setItem(TICKET_KEY,JSON.stringify(tickets));render()})}};
render();
</script></body></html>
